# Model parameters
model_params:
  num_trials: 250
  tau: 0.01       # baseline membrane time constant (s) for p/u/s/beta/gamma variables
  tauPlus: 0.01   # time constant (s) for the *Plus (filtered) variables
  tauY: 0.01       # membrane time constant (s) for the y1/y4 membrane potentials only
  beta1: 1.0
  beta4: 1.0
  gamma1: 1.0
  gamma4: 0.0
  alpha1: 10.0
  alpha4: 10.0
  b1: 0.5
  b4: 0.5
  g1: 0.5
  g4: 0.0
  sigma1: 0.07
  sigma4: 0.07
  Delta_x: 0   # prospective coding flag for V4 input drive: 0 = instantaneous, 1 = prospective

noise_params:
  tau_f: 0.001
  sigma_f: 0.01
  noise_potential: 0.000
  noise_firing_rate: 0.001
  GR_noise: true
  delta_tau: 3.0
  noise_sigma: 0.030
  noise_tau: 0.050
  low_pass_add: False
  rho: 0.10

Gain_modulation:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    t_span: [0, 10]

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.5, 0.75, 1.0, 1.25, 1.5]
    t_span: [0, 6]

Communication:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    # c_vals: [0.025, 0.037, 0.061, 0.097, 0.163, 0.359, 0.503, 0.72]
    c_vals: [1.0]
    t_span: [0, 10]
    save_data: true

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.5, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0]
    t_span: [0, 6]
    save_data: true

Power_spectra:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    c_vals: [0.0, 0.025, 0.037, 0.061, 0.097, 0.163, 0.359, 0.503, 0.72]
    t_span: [0, 5]
    save_data: true

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.50, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0, 0.5, 0.25, 0.125, 0.064, 0.032, 0.0]
    t_span: [0, 6]
    save_data: true

# Validation of the analytical (linearised) power spectra against direct
# stochastic simulation. See Analysis/SDE_validation.py.
SDE_validation:
  enabled: True
  gamma_vals: [1.0]
  c_vals: [0.5]
  t_span: [0, 5]            # window for the deterministic fixed-point solve
  mode: both                # linear | nonlinear | both
  integrator: exact         # standalone linear run: exact (Van Loan) or euler
  dt: 2.0e-5                # nonlinear (Euler) step (s); must be << the fastest time constant
  dt_linear: 1.0e-4         # exact linear run step (unbiased at any dt); null -> 1/record_fs
  T: 16.0                   # simulated seconds per trial, after burn-in
  burn_in: 3.0              # discarded transient (s); must exceed the slowest mode
  n_trials: 100
  linear_batch: 8           # trials advanced together in the linear run (caps memory)
  record_fs: 20000.0        # target sampling rate of the stored traces (Hz)
  welch_nperseg_sec: 4.0    # Welch segment length (s); must outlast the slowest mode
  welch_overlap: 0.5
  min_freq: 1.0
  max_freq: 200.0
  report_band: [20.0, 100.0]  # extra sub-band summarised in the report
  coherence_pairs: [['y1', 'y4']]   # the V1-V4 LFP pair Coherence_analysis.py reports
  # The published spectra include the additive low-pass measurement term. Overrides
  # noise_params.low_pass_add for this analysis only, so Power_spectra_analysis.py and
  # Coherence_analysis.py keep whatever noise_params says.
  low_pass_add: True
  seed: 0
  n_jobs: 16
  paired: True              # drive the linear system with the nonlinear run's noise
  clip_nonneg: True
  save_traces: True
  save_csd: True            # keep the pooled cross-spectral block for re-plotting

Coherence:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    c_vals: [0.025,0.037,0.061,0.097,0.163,0.359,0.503,0.72]
    # c_vals: [0.032, 0.064, 0.125, 0.25, 0.5, 1.0]
    t_span: [0, 6]

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.50, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0, 0.5, 0.25, 0.125, 0.064, 0.032, 0.0]
    t_span: [0, 6]
