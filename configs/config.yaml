# Model parameters
model_params:
  num_trials: 250
  beta1: 1.0
  beta4: 1.0
  gamma1: 1.0
  gamma4: 0.0
  alpha1: 10.0
  alpha4: 10.0
  b1: 0.5
  b4: 0.5
  g1: 0.5
  g4: 0.0
  sigma1: 0.07
  sigma4: 0.07
  Delta_x: 1   # prospective coding flag for V4 input drive: 0 = instantaneous, 1 = prospective

noise_params:
  tau_f: 0.001
  sigma_f: 0.01
  noise_potential: 0.000
  noise_firing_rate: 0.001
  GR_noise: true
  delta_tau: 3.0
  noise_sigma: 0.030
  noise_tau: 0.050
  low_pass_add: True
  rho: 0.10

Gain_modulation:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    t_span: [0, 10]

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.5, 0.75, 1.0, 1.25, 1.5]
    t_span: [0, 6]

Communication:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    # c_vals: [0.025, 0.037, 0.061, 0.097, 0.163, 0.359, 0.503, 0.72]
    c_vals: [1.0]
    t_span: [0, 10]
    save_data: true

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.5, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0]
    t_span: [0, 6]
    save_data: true

Power_spectra:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    c_vals: [0.0, 0.025, 0.037, 0.061, 0.097, 0.163, 0.359, 0.503, 0.72]
    t_span: [0, 5]
    save_data: true

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.50, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0, 0.5, 0.25, 0.125, 0.064, 0.032, 0.0]
    t_span: [0, 6]
    save_data: true

Coherence:
  Feedback_gain:
    enabled: True
    gamma_vals: [1.0]
    c_vals: [0.025,0.037,0.061,0.097,0.163,0.359,0.503,0.72]
    # c_vals: [0.032, 0.064, 0.125, 0.25, 0.5, 1.0]
    t_span: [0, 6]

  Input_gain_beta1:
    enabled: False
    beta1_vals: [0.50, 0.75, 1.0, 1.25, 1.5]
    c_vals: [1.0, 0.5, 0.25, 0.125, 0.064, 0.032, 0.0]
    t_span: [0, 6]
